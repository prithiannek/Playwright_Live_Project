[pytest]
markers =
    smoke: smoke labelled test cases
    sanity: Sanity test cases
    regression: Regression test cases
	endtoend: For entire workflow

addopts = --headed
          --browser=chromium
          --alluredir=testScripts/Reports/allure_results
          --html=testScripts/Reports/html_report.html
          --self-contained-html
          --screenshot=only-on-failure
